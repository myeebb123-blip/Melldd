<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF ليبيا</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial,Tahoma;color:#17202a}.app{max-width:430px;margin:auto;min-height:100vh;background:#f7f8fa}.top{background:#b4000b;color:white;padding:28px 18px 18px;display:flex;justify-content:space-between;font-weight:bold;font-size:20px}.pro{background:#ffd447;color:#604400;padding:6px 10px;border-radius:18px;font-size:12px}.p{padding:15px}.welcome{background:linear-gradient(135deg,#ffe5e7,#fff);padding:18px;border-radius:18px;margin-bottom:14px}.welcome b{color:#b4000b;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;padding:18px 8px;border-radius:17px;text-align:center;box-shadow:0 2px 9px #0001}.ic{width:44px;height:44px;margin:auto auto 9px;border-radius:13px;background:#c6000b;color:white;display:grid;place-items:center;font-size:22px}.card:nth-child(2) .ic{background:#2878e8}.card:nth-child(3) .ic{background:#16a05d}.card:nth-child(4) .ic{background:#7442d5}.card:nth-child(5) .ic{background:#e87b16}.card:nth-child(6) .ic{background:#008d9c}.card b{font-size:14px}.files{margin-top:18px}.file{background:#fff;padding:12px;border-radius:14px;margin:8px 0;display:flex;gap:10px;align-items:center}.pdf{width:42px;height:42px;border-radius:10px;background:#e31b23;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:bold}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:62px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center}.nav{font-size:11px;text-align:center;color:#7c858e}.active{color:#b4000b;font-weight:bold}.fab{position:fixed;bottom:75px;right:max(18px,calc((100% - 394px)/2));width:55px;height:55px;border:0;border-radius:50%;background:#e31b23;color:#fff;font-size:30px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:end}.sheet{background:#fff;width:min(430px,100%);margin:auto;padding:22px;border-radius:24px 24px 0 0}.btn{width:100%;padding:14px;margin:6px 0;border:0;border-radius:13px;background:#c6000b;color:#fff;font-weight:bold}.btn.alt{background:#f0f1f3;color:#333}</style></head><body><div class="app"><div class="top"><span>PDF ليبيا</span><span class="pro">👑 Pro</span></div><div class="p"><div class="welcome"><b>كل ملفاتك في مكان واحد</b><div>حوّل وادمج وقسّم واضغط ملفات PDF بسهولة.</div></div><div class="grid"><div class="card" onclick="Android.pickImage()"><div class="ic">↗</div><b>صور إلى PDF</b></div><div class="card" onclick="Android.merge()"><div class="ic">＋</div><b>دمج PDF</b></div><div class="card" onclick="Android.split()"><div class="ic">✂</div><b>تقسيم PDF</b></div><div class="card" onclick="Android.compress()"><div class="ic">⇩</div><b>ضغط PDF</b></div><div class="card"><div class="ic">✎</div><b>توقيع PDF</b></div><div class="card"><div class="ic">♢</div><b>حماية PDF</b></div></div><div class="files"><b>ملفاتي الأخيرة</b><div class="file"><div class="pdf">PDF</div><div><b>خطة المشروع.pdf</b><br><small>جاهز للمشاركة</small></div></div></div></div><button class="fab" onclick="document.querySelector('.modal').style.display='flex'">+</button><div class="bottom"><div class="nav active">⌂<br>الرئيسية</div><div class="nav">▣<br>ملفاتي</div><div class="nav">⌘<br>الأدوات</div><div class="nav">♛<br>Pro</div></div><div class="modal" onclick="this.style.display='none'"><div class="sheet" onclick="event.stopPropagation()"><b>إنشاء ملف PDF</b><button class="btn" onclick="Android.pickImage()">تحويل صور إلى PDF</button><button class="btn alt" onclick="this.parentElement.parentElement.style.display='none'">إلغاء</button></div></div></div><script>window.done=function(n){alert("تم إنشاء الملف: "+n)}</script></body></html>
