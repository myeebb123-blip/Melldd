name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing RELEASE_KEYSTORE_B64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing RELEASE_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing RELEASE_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing RELEASE_KEY_PASSWORD" && exit 1)

      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > release-key.jks
          chmod 600 release-key.jks

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" sign             --ks release-key.jks             --ks-pass env:KEYSTORE_PASSWORD             --key-pass env:KEY_PASSWORD             --ks-key-alias "$KEY_ALIAS"             --out app-release-signed.apk             app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hasebat-Al-Binaa-Release-Signed
          path: app-release-signed.apk
