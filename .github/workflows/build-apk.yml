name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Create temporary signing key
        run: |
          keytool -genkeypair \
            -keystore release-key.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Hasebat Al Binaa, OU=App, O=Melldd, L=Sirte, ST=Libya, C=LY"

      - name: Sign release APK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias release \
            --out app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hasebat-Al-Binaa-Release-Signed
          path: app-release-signed.apk
