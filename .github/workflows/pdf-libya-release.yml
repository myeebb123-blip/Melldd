name: PDF Libya Release APK
on:
  push:
    paths:
      - 'pdflibya/**'
      - '.github/workflows/pdf-libya-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdflibya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release
        run: gradle assembleRelease --no-daemon
      - name: Create temporary signing key
        run: |
          keytool -genkeypair -v -keystore pdf-libya-release.jks -storepass pdf-libya-temp -keypass pdf-libya-temp -alias pdflibya -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PDF Libya,O=PDF Libya,C=LY"
      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks pdf-libya-release.jks --ks-pass pass:pdf-libya-temp --key-pass pass:pdf-libya-temp --out app/build/outputs/apk/release/PDF-Libya-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/PDF-Libya-release-signed.apk
      - name: Upload signed APK and signing key
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Libya-Release-Signed
          path: |
            pdflibya/app/build/outputs/apk/release/PDF-Libya-release-signed.apk
            pdflibya/pdf-libya-release.jks
